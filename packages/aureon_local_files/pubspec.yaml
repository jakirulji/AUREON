name: aureon_local_files
description: Read-only native local-folder browsing for AUREON on Android and Windows.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.aureon.localfiles
        pluginClass: AureonLocalFilesPluginCApi
      windows:
        pluginClass: AureonLocalFilesPlugin

name: AUREON Backend Spike

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/aureon-backend-spike.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/aureon-backend-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Build and test Ktor spike
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"
      - name: Run backend tests
        working-directory: backend
        run: gradle --no-daemon :server:test
      - name: Build backend
        working-directory: backend
        run: gradle --no-daemon :server:build

name: AUREON Discovery Registry Validation (No Artifacts)

on:
  push:
    branches: [main]
    paths:
      - "backend/discovery-registry/**"
      - ".github/workflows/aureon-discovery-registry.yml"
  pull_request:
    paths:
      - "backend/discovery-registry/**"
      - ".github/workflows/aureon-discovery-registry.yml"
  workflow_dispatch:

concurrency:
  group: aureon-discovery-registry-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/discovery-registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Cloudflare dry-run
        run: npm run dry-run

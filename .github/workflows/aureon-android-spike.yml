name: AUREON Android Storage Spike

on:
  push:
    branches: [main]
    paths:
      - "android-spike/**"
      - "shared/**"
      - ".github/workflows/aureon-android-spike.yml"
  pull_request:
    paths:
      - "android-spike/**"
      - ".github/workflows/aureon-android-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-storage:
    name: Compile and test Room storage spike
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Export Flutter SDK path
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          flutter --version
          flutter precache --android
      - name: Accept Android SDK licenses and install API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$LICENSE_STATUS" -ne 0 ]; then exit "$LICENSE_STATUS"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate shared Dart contracts
        working-directory: shared/aureon_contracts
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Generate and analyze Pigeon APIs
        working-directory: android-spike/pigeon
        run: |
          flutter pub get
          mkdir -p lib/src
          mkdir -p ../storage/src/main/kotlin/com/aureon/storage/generated
          dart run pigeon --input aureon_storage_api.dart \
            --dart_out lib/src/aureon_storage_api.g.dart \
            --kotlin_out ../storage/src/main/kotlin/com/aureon/storage/generated/AureonStorageApi.g.kt \
            --kotlin_package com.aureon.storage.generated
          flutter analyze --no-pub
      - name: Run Room persistence tests
        working-directory: android-spike
        run: gradle --no-daemon --stacktrace --info :storage:testDebugUnitTest
      - name: Compile generated Kotlin bridge
        working-directory: android-spike
        run: gradle --no-daemon :storage:compileDebugKotlin
      - name: Assemble Android storage module
        working-directory: android-spike
        run: gradle --no-daemon :storage:assembleDebug

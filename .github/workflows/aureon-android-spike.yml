name: AUREON Android Storage Spike

on:
  push:
    branches: [main]
    paths:
      - "android-spike/**"
      - ".github/workflows/aureon-android-spike.yml"
  pull_request:
    paths:
      - "android-spike/**"
      - ".github/workflows/aureon-android-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-storage:
    name: Compile and test Room storage spike
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$LICENSE_STATUS" -ne 0 ]; then exit "$LICENSE_STATUS"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Run Room persistence tests
        working-directory: android-spike
        run: gradle --no-daemon --stacktrace --info :storage:testDebugUnitTest
      - name: Assemble Android storage module
        working-directory: android-spike
        run: gradle --no-daemon :storage:assembleDebug

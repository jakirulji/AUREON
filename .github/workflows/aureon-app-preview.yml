name: AUREON App Preview Builds

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/aureon_local_files/**"
      - "shared/aureon_contracts/**"
      - ".github/workflows/aureon-app-preview.yml"
  pull_request:
    paths:
      - "app/**"
      - "packages/aureon_local_files/**"
      - "shared/aureon_contracts/**"
      - ".github/workflows/aureon-app-preview.yml"
  workflow_dispatch:

concurrency:
  group: aureon-app-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-validation:
    name: Analyze, test and compile Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Export Flutter SDK path
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          flutter precache --android
      - name: Prepare local Dart packages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packages" "$RUNNER_TEMP/shared"
          cp -R packages/aureon_local_files "$RUNNER_TEMP/packages/aureon_local_files"
          cp -R shared/aureon_contracts "$RUNNER_TEMP/shared/aureon_contracts"
      - name: Generate Android host project
        shell: bash
        run: |
          flutter create --empty --platforms=android --project-name backup --org com.aureon "$RUNNER_TEMP/aureon-android"
          cp app/android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/aureon-android/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$RUNNER_TEMP/aureon-android/android/app/src/main/res/drawable"
          cp app/android/app/src/main/res/drawable/aureon_launcher_icon.xml "$RUNNER_TEMP/aureon-android/android/app/src/main/res/drawable/aureon_launcher_icon.xml"
          sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 26/" "$RUNNER_TEMP/aureon-android/android/app/build.gradle.kts"
          cp app/pubspec.yaml "$RUNNER_TEMP/aureon-android/pubspec.yaml"
          mkdir -p "$RUNNER_TEMP/aureon-android/assets"
          cp -R app/assets/. "$RUNNER_TEMP/aureon-android/assets/"
          rm -rf "$RUNNER_TEMP/aureon-android/lib" "$RUNNER_TEMP/aureon-android/test" "$RUNNER_TEMP/aureon-android/integration_test"
          cp -R app/lib "$RUNNER_TEMP/aureon-android/lib"
          cp -R app/test "$RUNNER_TEMP/aureon-android/test"
          cp -R app/integration_test "$RUNNER_TEMP/aureon-android/integration_test"
          mkdir -p "$RUNNER_TEMP/aureon-android/android/aureon_storage"
          cp -R android-spike/storage/. "$RUNNER_TEMP/aureon-android/android/aureon_storage/"
          mkdir -p "$RUNNER_TEMP/aureon-android/shared/contract-fixtures"
          cp -R shared/contract-fixtures/. "$RUNNER_TEMP/aureon-android/shared/contract-fixtures/"
          mkdir -p "$RUNNER_TEMP/aureon-android/android/app/src/main/kotlin/com/aureon/backup"
          cp app/android/app/src/main/kotlin/com/aureon/backup/MainActivity.kt "$RUNNER_TEMP/aureon-android/android/app/src/main/kotlin/com/aureon/backup/MainActivity.kt"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'aureon-android' / 'android'
          settings = root / 'settings.gradle.kts'
          source = settings.read_text()
          agp_line = next((line.strip() for line in source.splitlines() if 'id("com.android.application")' in line), None)
          kotlin_line = next((line.strip() for line in source.splitlines() if 'id("org.jetbrains.kotlin.android")' in line), None)
          if not agp_line or not kotlin_line:
              raise SystemExit("Could not determine Android Gradle Plugin/Kotlin versions from generated Flutter host.")
          agp_version = agp_line.split('version "')[1].split('"')[0]
          # Room 2.8.5's KAPT metadata reader supports Kotlin metadata up to 2.3.
          # Flutter stable may generate a newer Kotlin plugin (2.4.x), which
          # makes Room annotation processing fail before Kotlin compilation.
          # Keep this temporary validation host aligned with the tested
          # Android storage spike toolchain until Room's processor supports it.
          kotlin_version = "2.3.10"
          pinned_kotlin_line = re.sub(r'version ".*?"', f'version "{kotlin_version}"', kotlin_line)
          source = source.replace(agp_line, agp_line + f'\n    id("com.android.library") version "{agp_version}" apply false', 1)
          source = source.replace(kotlin_line, pinned_kotlin_line + f'\n    id("org.jetbrains.kotlin.kapt") version "{kotlin_version}" apply false', 1)
          source += '\ninclude(":aureon_storage")\nproject(":aureon_storage").projectDir = file("aureon_storage")\n'
          settings.write_text(source)
          app_gradle = root / 'app' / 'build.gradle.kts'
          app_gradle.write_text(app_gradle.read_text() + '\ndependencies { implementation(project(":aureon_storage")) }\n')
          PY
      - name: Test native plugin Dart contract
        working-directory: packages/aureon_local_files
        run: |
          flutter pub get
          flutter test
      - name: Test shared cross-platform contracts
        working-directory: shared/aureon_contracts
        run: |
          dart pub get
          dart test
      - name: Generate Android transfer Pigeon bindings
        working-directory: android-spike/pigeon
        shell: bash
        run: |
          flutter pub get
          mkdir -p "$RUNNER_TEMP/aureon-android/lib/src/transfers"
          mkdir -p "$RUNNER_TEMP/aureon-android/android/aureon_storage/src/main/kotlin/com/aureon/storage/generated"
          dart run pigeon --input aureon_storage_api.dart \
            --dart_out "$RUNNER_TEMP/aureon-android/lib/src/transfers/aureon_storage_api.g.dart" \
            --kotlin_out "$RUNNER_TEMP/aureon-android/android/aureon_storage/src/main/kotlin/com/aureon/storage/generated/AureonStorageApi.g.kt" \
            --kotlin_package com.aureon.storage.generated
      - name: Resolve Flutter dependencies
        working-directory: ${{ runner.temp }}/aureon-android
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: ${{ runner.temp }}/aureon-android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: ${{ runner.temp }}/aureon-android
        run: flutter test
      - name: Compile Android debug APK
        working-directory: ${{ runner.temp }}/aureon-android
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug --verbose && exit 0
            status=$?
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "Gradle download/build failed (attempt $attempt); retrying after a short backoff."
            sleep $((attempt * 20))
          done

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::The hosted runner does not expose /dev/kvm; x86_64 emulator integration tests cannot start."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run Android native transfer bridge integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The runner exposes /dev/kvm, but its default permissions exclude
          # the GitHub Actions user. Enable access before launching x86_64.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          script: cd "${{ runner.temp }}/aureon-android" && test -f pubspec.yaml && flutter test integration_test/transfer_bridge_test.dart

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: AUREON-Android-Debug-APK
          path: ${{ runner.temp }}/aureon-android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-validation:
    name: Analyze, test and compile Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare local Dart packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/packages" | Out-Null
          Copy-Item packages/aureon_local_files "$env:RUNNER_TEMP/packages/aureon_local_files" -Recurse
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/shared" | Out-Null
          Copy-Item shared/aureon_contracts "$env:RUNNER_TEMP/shared/aureon_contracts" -Recurse
      - name: Generate Windows host project
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --empty --platforms=windows --project-name aureon --org com.aureon "$env:RUNNER_TEMP/aureon-windows"
          Copy-Item app/assets/branding/aureon.ico "$env:RUNNER_TEMP/aureon-windows/windows/runner/resources/app_icon.ico" -Force
          npm install --no-save sharp
          @'
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");
          (async () => {
            const root = process.env.RUNNER_TEMP;
            const svg = path.join(process.cwd(), "app", "assets", "branding", "aureon-icon.svg");
            const ico = path.join(root, "aureon-windows", "windows", "runner", "resources", "app_icon.ico");
            const sizes = [256, 128, 64, 48, 32, 16];
            const pngs = [];
            for (const size of sizes) {
              pngs.push(await sharp(svg).resize(size, size, { fit: "contain" }).png().toBuffer());
            }
            const header = Buffer.alloc(6 + sizes.length * 16);
            header.writeUInt16LE(0, 0);
            header.writeUInt16LE(1, 2);
            header.writeUInt16LE(sizes.length, 4);
            let offset = header.length;
            for (let i = 0; i < sizes.length; i++) {
              const size = sizes[i], data = pngs[i], pos = 6 + i * 16;
              header.writeUInt8(size === 256 ? 0 : size, pos);
              header.writeUInt8(size === 256 ? 0 : size, pos + 1);
              header.writeUInt8(0, pos + 2);
              header.writeUInt8(0, pos + 3);
              header.writeUInt16LE(1, pos + 4);
              header.writeUInt16LE(32, pos + 6);
              header.writeUInt32LE(data.length, pos + 8);
              header.writeUInt32LE(offset, pos + 12);
              offset += data.length;
            }
            fs.writeFileSync(ico, Buffer.concat([header, ...pngs]));
            console.log("Generated valid PNG-compressed AUREON ICO from SVG.");
          })().catch(err => { console.error(err); process.exit(1); });
          '@ | node -
          if (-not (Test-Path "$env:RUNNER_TEMP/aureon-windows/windows/runner/resources/app_icon.ico")) { throw "AUREON Windows icon was not installed into the runner project." }
          Copy-Item app/pubspec.yaml "$env:RUNNER_TEMP/aureon-windows/pubspec.yaml" -Force
          Copy-Item app/assets "$env:RUNNER_TEMP/aureon-windows/assets" -Recurse -Force
          Remove-Item "$env:RUNNER_TEMP/aureon-windows/lib" -Recurse -Force
          if (Test-Path "$env:RUNNER_TEMP/aureon-windows/test") { Remove-Item "$env:RUNNER_TEMP/aureon-windows/test" -Recurse -Force }
          Copy-Item app/lib "$env:RUNNER_TEMP/aureon-windows/lib" -Recurse
          Copy-Item app/test "$env:RUNNER_TEMP/aureon-windows/test" -Recurse
      - name: Test native plugin Dart contract
        shell: pwsh
        working-directory: packages/aureon_local_files
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shared cross-platform contracts
        shell: pwsh
        working-directory: shared/aureon_contracts
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve Flutter dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Windows transfer Dart binding
        shell: pwsh
        working-directory: android-spike/pigeon
        run: |
          flutter pub get
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/aureon-windows/lib/src/transfers" | Out-Null
          dart run pigeon --input aureon_storage_api.dart --dart_out "$env:RUNNER_TEMP/aureon-windows/lib/src/transfers/aureon_storage_api.g.dart"

      - name: Analyze Flutter app
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Flutter tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows release
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseDir = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          if (-not (Test-Path (Join-Path $releaseDir "aureon.exe"))) {
            throw "Expected AUREON executable was not produced: $releaseDir/aureon.exe"
          }
          Get-ChildItem $releaseDir -Recurse | Select-Object FullName, Length

      - name: Package Windows preview ZIP
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          $releaseDir = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "aureon.exe"
          $appPayload = Join-Path $releaseDir "data/app.so"
          if (-not (Test-Path $exe)) { throw "AUREON executable is missing from the Windows release directory." }
          if (-not (Test-Path $appPayload)) { throw "Flutter application payload data/app.so is missing from the Windows release directory." }
          if ((Get-Item $exe).Length -lt 64KB) { throw "AUREON Windows launcher executable is unexpectedly small." }
          if ((Get-Item $appPayload).Length -lt 1MB) { throw "Flutter application payload is unexpectedly small." }
          $previewDir = Join-Path $env:RUNNER_TEMP "aureon-windows-preview"
          New-Item -ItemType Directory -Force $previewDir | Out-Null
          $zipPath = Join-Path $previewDir "AUREON-Windows-Preview.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -ieq "aureon.exe" } | Select-Object -First 1
            $payload = $archive.Entries | Where-Object { $_.FullName -ieq "data/app.so" } | Select-Object -First 1
            if (-not $entry) { throw "Windows preview ZIP does not contain aureon.exe at its root." }
            if ($entry.Length -lt 64KB) { throw "AUREON launcher executable inside the preview ZIP is unexpectedly small." }
            if (-not $payload -or $payload.Length -lt 1MB) { throw "Windows preview ZIP does not contain a valid Flutter application payload." }
          } finally {
            $archive.Dispose()
          }
          Get-Item $zipPath | Select-Object FullName, Length

      - name: Upload Windows preview ZIP
        uses: actions/upload-artifact@v6
        with:
          name: AUREON-Windows-Preview-ZIP
          path: ${{ runner.temp }}/aureon-windows-preview/AUREON-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows installer EXE
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $version = (Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' ).Matches.Groups[1].Value
          if (-not $version) { throw "Could not read AUREON version from pubspec.yaml" }
          $releaseDir = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          $outputDir = Join-Path $env:RUNNER_TEMP "aureon-windows-installer"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $iss = Join-Path $env:RUNNER_TEMP "aureon-installer.iss"
          $setupIcon = Join-Path (Get-Location) "windows/runner/resources/app_icon.ico"
          @"
          #define MyAppName "AUREON"
          #define MyAppVersion "$version"
          #define MyAppExeName "aureon.exe"
          [Setup]
          AppId={{9C0A7B4E-3F21-4D8C-9A61-6E2B4A8F1C30}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=AUREON
          DefaultDirName={autopf}\AUREON
          DefaultGroupName=AUREON
          OutputDir=$outputDir
          OutputBaseFilename=AUREON-Setup-$version
          SetupIconFile=$setupIcon
          UninstallDisplayIcon={app}\aureon.exe
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"
          [Files]
          Source: "$releaseDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\AUREON"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\AUREON"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch AUREON"; Flags: postinstall skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $outputDir "AUREON-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer EXE missing: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Windows installer EXE is unexpectedly small." }
          Get-Item $installer | Select-Object FullName, Length

      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@v6
        with:
          name: AUREON-Windows-Setup-EXE
          path: ${{ runner.temp }}/aureon-windows-installer/AUREON-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

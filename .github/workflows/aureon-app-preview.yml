name: AUREON App Preview Builds

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/aureon-app-preview.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/aureon-app-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Build and test Android APK preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        shell: bash
        run: |
          flutter create --empty --platforms=android --project-name aureon --org com.aureon "$RUNNER_TEMP/aureon-android"
          cp app/pubspec.yaml "$RUNNER_TEMP/aureon-android/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/aureon-android/lib" "$RUNNER_TEMP/aureon-android/test"
          cp -R app/lib "$RUNNER_TEMP/aureon-android/lib"
          cp -R app/test "$RUNNER_TEMP/aureon-android/test"
      - name: Test and build debug APK
        working-directory: ${{ runner.temp }}/aureon-android
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: aureon-android-debug-apk
          path: ${{ runner.temp }}/aureon-android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-preview:
    name: Build Windows desktop preview
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host project
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --empty --platforms=windows --project-name aureon --org com.aureon "$env:RUNNER_TEMP/aureon-windows"
          Copy-Item app/pubspec.yaml "$env:RUNNER_TEMP/aureon-windows/pubspec.yaml" -Force
          Remove-Item "$env:RUNNER_TEMP/aureon-windows/lib" -Recurse -Force
          if (Test-Path "$env:RUNNER_TEMP/aureon-windows/test") { Remove-Item "$env:RUNNER_TEMP/aureon-windows/test" -Recurse -Force }
          Copy-Item app/lib "$env:RUNNER_TEMP/aureon-windows/lib" -Recurse
          Copy-Item app/test "$env:RUNNER_TEMP/aureon-windows/test" -Recurse
      - name: Test and build Windows release
        shell: pwsh
        working-directory: ${{ runner.temp }}/aureon-windows
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/aureon-windows/build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/aureon.exe")) { throw "AUREON executable not found" }
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/AUREON-Windows-Preview.zip" -Force
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v6
        with:
          name: aureon-windows-preview
          path: ${{ runner.temp }}/AUREON-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 14

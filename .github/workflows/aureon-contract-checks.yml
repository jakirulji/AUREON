name: AUREON Contract Checks

on:
  push:
    branches: [main]
    paths:
      - "docs/openapi/**"
      - "docs/migrations/**"
      - "tests/database/**"
      - ".github/workflows/aureon-contract-checks.yml"
  pull_request:
    paths:
      - "docs/openapi/**"
      - "docs/migrations/**"
      - "tests/database/**"
      - ".github/workflows/aureon-contract-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
      - name: Validate OpenAPI 3.1 document
        run: openapi-spec-validator docs/openapi/v1.yaml

  postgres:
    name: Apply and verify PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aureon
          POSTGRES_PASSWORD: aureon_ci_only
          POSTGRES_DB: aureon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureon -d aureon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply V001 baseline schema
        env:
          PGPASSWORD: aureon_ci_only
        run: |
          psql -h localhost -U aureon -d aureon_test -v ON_ERROR_STOP=1 \
            -f docs/migrations/V001__initial_schema.sql
      - name: Apply V002 vault and provider inventory
        env:
          PGPASSWORD: aureon_ci_only
        run: |
          psql -h localhost -U aureon -d aureon_test -v ON_ERROR_STOP=1 \
            -f docs/migrations/V002__vault-and-provider-inventory.sql
      - name: Verify V001 baseline constraints
        env:
          PGPASSWORD: aureon_ci_only
        run: |
          psql -h localhost -U aureon -d aureon_test -v ON_ERROR_STOP=1 \
            -f tests/database/V001_schema_smoke.sql
      - name: Verify V002 vault and inventory constraints
        env:
          PGPASSWORD: aureon_ci_only
        run: |
          psql -h localhost -U aureon -d aureon_test -v ON_ERROR_STOP=1 \
            -f tests/database/V002_vault_inventory_smoke.sql

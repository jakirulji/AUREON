name: AUREON Cloudflare Worker Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureon-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Validate deployment configuration
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply aureon-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

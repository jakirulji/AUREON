version: 2
updates:
  - package-ecosystem: gradle
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-and-ktor:
        patterns:
          - "org.jetbrains.kotlin*"
          - "io.ktor*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: aureon
description: AUREON cross-platform file management prototype.
publish_to: none
version: 0.1.1+3
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter
  archive: ^4.7.1
  path: ^1.9.1
  aureon_local_files:
    path: ../packages/aureon_local_files
  shared_preferences: ^2.5.3
  disk_space_plus: ^0.2.6
  cryptography: ^2.9.0
  webcrypto: ^0.6.1
  file_picker: ^13.3.2
  flutter_secure_storage: ^11.2.0
  permission_handler: ^12.0.1
  meta: ^1.16.0
  path_provider: ^2.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  aureon_contracts:
    path: ../shared/aureon_contracts
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/guides/google-drive-oauth-setup.txt

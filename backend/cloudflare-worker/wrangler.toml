name = "aureon-api"
main = "src/index.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "aureon-7f612"
ENVIRONMENT = "production"
AUREON_VAULT_ACTIVE_ROOT_VERSION = "1"

[[d1_databases]]
binding = "DB"
database_name = "aureon-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Configure the production Worker Secret:
# wrangler secret put AUREON_VAULT_ROOT_SECRET_V1
# The value must be 32 random bytes encoded as unpadded base64url.
# During rotation, retain V1 while configuring V2 and migrating every envelope.
